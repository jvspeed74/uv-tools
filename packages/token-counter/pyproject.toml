[project]
name = "token-counter"
version = "0.1.0"
description = "Count tokens per file across files and directories, sorted most to least"
requires-python = ">=3.13"
dependencies = [
    "tiktoken>=0.8",
]

[project.scripts]
token-counter = "token_counter.cli:main"

[dependency-groups]
bench = ["psutil>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/token_counter"]

[tool.pytest.ini_options]
markers = [
    "unit: pure-function tests with zero external dependencies",
    "integration: a module verified against a real dependency, without going through the CLI entry point",
    "e2e: the full pipeline through the actual CLI entry point",
]
addopts = "--strict-markers"
testpaths = ["tests"]
